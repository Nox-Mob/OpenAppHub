name: CI

on:
  pull_request:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Shared code under the apps' strictest settings
        run: npm run check:shared-strict
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  db:
    # Core SQL + DB tests on Postgres 16 with a Supabase stub (db/tests/supabase_stub.sql).
    # The same script works against `supabase start`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash db/tests/run.sh
      - name: Self-hosted check (core SQL alone, no hub or billing)
        run: |
          psql "$DATABASE_URL" -c 'create database selfhosted'
          DATABASE_URL="${DATABASE_URL%/*}/selfhosted" bash db/tests/run-selfhosted.sh
