name: CI

on:
  pull_request:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Shared code under the apps' strictest settings
        run: npm run check:shared-strict
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    # The hub's screens in a browser, on the dev server's preview routes (/dev/hub: sample data,
    # no backend, no secrets). GitHub's Ubuntu runners ship Google Chrome stable.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Google Chrome
        run: command -v google-chrome || npx playwright install --with-deps chrome
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  db:
    # Core SQL + DB tests on Postgres 16 with a Supabase stub (db/tests/supabase_stub.sql).
    # The same script works against `supabase start`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash db/tests/run.sh
      - name: Self-hosted check (core SQL alone, no hub or billing)
        run: |
          psql "$DATABASE_URL" -c 'create database selfhosted'
          DATABASE_URL="${DATABASE_URL%/*}/selfhosted" bash db/tests/run-selfhosted.sh
